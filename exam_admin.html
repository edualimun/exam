
<html lang="bn">
<head>
    <meta charset="UTF-8"></meta>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"></meta>
    <title>অ্যাডমিন প্যানেল - EduAlimun</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .admin-container { max-width: 600px; background: white; padding: 30px; margin: auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007bff; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #333; }
        input[type="text"], input[type="number"], input[type="password"], textarea { width: 100%; padding: 12px; margin-top: 5px; border: 2px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        textarea { height: 180px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        #pub-btn { background: #007bff; }
        #reset-btn { background: #dc3545; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f4f6f9; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .login-box h3 { color: #333; margin-bottom: 15px; }
        .login-box button { background: #28a745; margin-top: 15px; }
    </style>
</head>
<body>

<div class="login-overlay" id="login-screen">
    <div class="login-box">
        <h3>🔐 EduAlimun সিকিউরড লগইন</h3>
        <p style="color: #666666; font-size: 14px;">অ্যাডমিন প্যানেলে প্রবেশ করতে পাসওয়ার্ড দিন</p>
        <input id="admin-password-field" placeholder="পাসওয়ার্ড এখানে লিখুন..." type="password" />
        <button onclick="checkAdminPassword()">প্যানেল আনলক করুন</button>
    </div>
</div>

<div class="admin-container" id="main-admin-content" style="display: none;">
    <h2>⚙️ EduAlimun অ্যাডমিন প্যানেল</h2>
    
    <label>১. পরীক্ষার বিষয়ের নাম:</label>
    <input id="exam-subject" placeholder="যেমন: SSC পদার্থবিজ্ঞান ১ম অধ্যায়" type="text" />
    
    <label>২. পরীক্ষার তারিখ ও সময়সীমা (Date Range):</label>
    <input id="exam-date" placeholder="যেমন: ২৫ জুন থেকে ৩০ জুন রাত ৯টা পর্যন্ত" type="text" />

    <label>৩. সময় নির্ধারণ করুন (মিনিট):</label>
    <input id="exam-duration" min="1" placeholder="যেমন: ২০" type="number" />
    
    <label>৪. প্রশ্ন, অপশন ও উত্তর পেস্ট করুন:</label>
    <textarea id="raw-questions" placeholder="১. বাংলাদেশের রাজধানী কোথায়?
ক) খুলনা
খ) ঢাকা
গ) সিলেট
ঘ) বরিশাল
উত্তর: খ"></textarea>
    
    <div class="btn-group">
        <button id="pub-btn" onclick="publishExam()">🚀 পরীক্ষা লাইভ করুন</button>
        <button id="reset-btn" onclick="resetAllData()">🧹 সব ডাটা রিসেট করুন</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyx5C-OvcYQ0eX_vXGraYzyQr_tOEmlwSquG8-eWtfrv_c82jLYefBCLo56Jq3F8g1a/exec";

    function checkAdminPassword() {
        if (document.getElementById('admin-password-field').value === "EduAlimun123@#") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-admin-content').style.display = 'block';
        } else {
            alert("❌ ভুল পাসওয়ার্ড!");
            document.getElementById('admin-password-field').value = '';
        }
    }

    function publishExam() {
        const subject = document.getElementById('exam-subject').value.trim();
        const examDate = document.getElementById('exam-date').value.trim();
        const duration = document.getElementById('exam-duration').value.trim();
        const text = document.getElementById('raw-questions').value.trim();
        if(!subject || !duration || !text) { alert("সবগুলো ঘর পূরণ করুন!"); return; }

        document.getElementById('pub-btn').innerText = "পাবলিশ হচ্ছে...";
        document.getElementById('pub-btn').disabled = true;

        // প্রশ্ন ব্লকগুলোকে বিভক্ত করা
        const blocks = text.split(/\n\s*\n/);
        let parsedQuestions = [];
        
        blocks.forEach((block, idx) => {
            const lines = block.split('\n').map(l => l.trim()).filter(l => l);
            if (lines.length >= 3) {
                let qText = lines[0];
                let opts = [];
                let rawAns = '';
                
                lines.forEach(line => {
                    // অপশন ডিটেকশন আরও শক্তিশালী করা হয়েছে (ক, খ, গ, ঘ এর পর যেকোনো চিহ্ন বা স্পেস থাকলে কাজ করবে)
                    if (line.match(/^[কখগঘA-Dঅআইঈ][\)\.\s\-]/)) {
                        opts.push(line);
                    } else if (line.includes('উত্তর:')) {
                        rawAns = line.split('উত্তর:')[1].trim().replace(/\s+/g, '');
                    }
                });

                // সঠিক উত্তরের নিখুঁত ইনডেক্স নির্ধারণ
                let ansIndex = "0";
                if(rawAns.includes('ক') || rawAns.toUpperCase().includes('A')) ansIndex = "1";
                else if(rawAns.includes('খ') || rawAns.toUpperCase().includes('B')) ansIndex = "2";
                else if(rawAns.includes('গ') || rawAns.toUpperCase().includes('C')) ansIndex = "3";
                else if(rawAns.includes('ঘ') || rawAns.toUpperCase().includes('D')) ansIndex = "4";

                if (opts.length > 0 && ansIndex !== "0") {
                    parsedQuestions.push({ id: idx + 1, question: qText, options: opts, answer: ansIndex });
                }
            }
        });

        if(parsedQuestions.length === 0) {
            alert("⚠️ কোনো সঠিক প্রশ্ন খুঁজে পাওয়া যায়নি! প্রশ্ন লেখার ফরম্যাট চেক করুন।");
            document.getElementById('pub-btn').innerText = "🚀 পরীক্ষা লাইভ করুন";
            document.getElementById('pub-btn').disabled = false;
            return;
        }

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "publish", subject: subject, duration: duration, examDate: examDate, questions: parsedQuestions })
        }).then(() => {
            alert("🎯 পরীক্ষা সফলভাবে লাইভ হয়েছে!");
            document.getElementById('pub-btn').innerText = "🚀 পরীক্ষা লাইভ করুন";
            document.getElementById('pub-btn').disabled = false;
            document.getElementById('exam-subject').value = '';
            document.getElementById('exam-date').value = '';
            document.getElementById('exam-duration').value = '';
            document.getElementById('raw-questions').value = '';
        });
    }

    function resetAllData() {
        if(!confirm("⚠️ আপনি কি নিশ্চিত? এটি ক্লিক করলে গুগল শিটের সব প্রশ্ন এবং লিডারবোর্ডের সব রেজাল্ট চিরতরে মুছে যাবে!")) return;
        
        document.getElementById('reset-btn').innerText = "রিসেট হচ্ছে...";
        document.getElementById('reset-btn').disabled = true;

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "reset" })
        }).then(() => {
            alert("🧹 গুগল শিটের সকল প্রশ্ন এবং লিডারবোর্ডের ডাটা সফলভাবে মুছে ফেলা হয়েছে!");
            document.getElementById('reset-btn').innerText = "🧹 সব ডাটা রিসেট করুন";
            document.getElementById('reset-btn').disabled = false;
        });
    }
</script>
</body>
</html>
